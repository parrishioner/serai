# Serai configuration
# Copy this file to config.yaml and customize for your search.

# Path to your candidate profile
candidate:
  profile_path: "./candidate_data/candidate_profile.txt"

# Job filters — roles that don't match are skipped before LLM scoring
filters:
  locations: ["San Jose, CA", "Remote"]
  min_base_salary: 200000
  levels: ["Senior", "Staff", "Principal", "Group PM"]
  role_keywords: ["product manager", "growth", "platform"]

# Scoring thresholds — control what gets promoted, routed, or skipped
scoring:
  promotion_threshold: 7.0       # company score to auto-promote from discovery
  watchlist_threshold: 6.0       # company score to keep on watchlist
  role_interest_threshold: 7.0   # minimum role interest to surface
  min_company_interest: 6.0      # minimum company score for routing
  max_jobs_per_company: 8        # cap roles evaluated per company per run

# ATS boards to scan for company discovery
sources:
  ats_boards: ["greenhouse", "ashby", "workday"]

# Notion — results are written here
notion:
  database_id: "env:NOTION_DATABASE_ID"
  api_key: "env:NOTION_API_KEY"

# API keys — loaded from .env, not stored here
api_keys:
  openai: "env:OPENAI_API_KEY"
  brave: "env:BRAVE_API_KEY"
